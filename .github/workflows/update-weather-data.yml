name: Update weather data

on:
  schedule:
    # Daily at 12:30 UTC, right after the SPC convective day (12Z-12Z) closes
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "How many past days of SPC reports to fetch"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and append SPC storm reports
        env:
          DAYS_BACK: ${{ github.event.inputs.days_back || '10' }}
        run: python scripts/update_weather_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new weather events today."
          else
            git commit -m "Auto-update weather data ($(date -u +%Y-%m-%d))"
            git push
          fi
